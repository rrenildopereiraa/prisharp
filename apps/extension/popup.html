<!doctype html>
<html lang="en" class="cs:ld">
	<head>
		<meta charset="utf-8" />
		<title>Prisharp</title>
		<link rel="stylesheet" href="popup.css" />
		<link rel="stylesheet" href="src/material.css" />
		<script type="module" src="src/popup.js"></script>
	</head>
	<body data-material="shell" class="m:0 c:ink ff:d">
		<main id="main" class="d:f fd:c p:4 w:var(--popup-width)">
			<div data-material="rim" class="as:c p:1 br:9999 bs-o:var(--shadow-rim)">
				<div
					data-material="track"
					class="d:f ai:c g:1 p:1 br:9999 bs-o:var(--shadow-track)"
				>
					<nav
						id="pill"
						aria-label="Detected technologies"
						aria-busy="true"
						class="d:f ai:c g:1"
					>
						<span class="px:4 py:2 fs:sm c:ink-dim ws:nw"
							>Reading the page…</span
						>
					</nav>
					<span id="divider" hidden class="w:px h:5 mx:1 bg:divider"></span>
					<button
						id="toggle"
						type="button"
						hidden
						aria-expanded="false"
						aria-controls="stack"
						aria-label="Show the stack"
						class="d:f ai:c jc:c fs:0 w:10 h:10 br:9999 b:0 bg:transparent c:ink-dim h:c:ink c:p fv:os:s fv:ow:2 fv:oo:2 fv:oc:glow"
					>
						<svg
							id="chevron"
							aria-hidden="true"
							width="14"
							height="14"
							viewBox="0 0 14 14"
							fill="none"
							stroke="currentColor"
							stroke-width="1.8"
							stroke-linecap="round"
							stroke-linejoin="round"
							class="tp:t tdu:300 ttf:io @prm:tp:none"
						>
							<path d="M3.5 5.5L7 9l3.5-3.5" />
						</svg>
					</button>
				</div>
			</div>
			<!-- Closed, the stack folds to no height; its padding sits inside. -->
			<section
				id="stack"
				inert
				class="h:0 o:0 o:h tp:a tdu:300 ttf:io @prm:tp:none"
			>
				<div class="d:f fd:c g:3 pt:3">
					<ul
						id="list"
						data-material="well"
						class="d:f fd:c g:1 m:0 p:1 br:3xl bs-o:var(--shadow-well)"
					></ul>
					<div class="d:f ai:c jc:sb g:4 pl:3 pr:1">
						<p id="summary" class="m:0 fs:xs c:ink-dim ws:nw"></p>
						<button
							id="copy"
							type="button"
							data-material="knob"
							class="h:9 px:4 br:9999 b:1 bc:knob-edge bs-o:var(--shadow-knob) ff:d fs:xs fw:500 c:ink c:p tp:a tdu:150 a:s:95 @prm:tp:none fv:os:s fv:ow:2 fv:oo:2 fv:oc:glow"
						>
							Copy stack
						</button>
					</div>
				</div>
			</section>
		</main>
	</body>
</html>
