<!doctype html>
<html lang="en" class="cs:ld">
	<head>
		<meta charset="utf-8" />
		<title>Prisharp</title>
		<link rel="stylesheet" href="popup.css" />
		<link rel="stylesheet" href="src/base.css" />
		<script type="module" src="src/popup.js"></script>
	</head>
	<!-- Drawn like Chrome's site information panel: a title, rows that open a
	     page of their own, and quiet actions at the bottom. -->
	<body class="m:0 w:80 bg:surface c:ink ff:d fs:sm">
		<main>
			<section id="home" aria-labelledby="host">
				<header class="d:f ai:fs g:3 pt:4 pb:3 pl:4 pr:2">
					<div class="fg:1 min-w:0">
						<h1 id="host" class="m:0 fs:md fw:400 o:h to:e ws:nw">Prisharp</h1>
						<p id="status" role="status" class="m:0 mt:1 fs:xs c:muted">
							Reading the page…
						</p>
					</div>
					<button
						type="button"
						data-close
						aria-label="Close"
						class="d:f ai:c jc:c fs:0 w:8 h:8 br:9999 bw:0 bg:transparent c:muted h:bg:hover c:p fv:os:s fv:ow:2 fv:oc:focus"
					>
						<span data-symbol="close" class="d:f w:5 h:5"></span>
					</button>
				</header>
				<hr class="m:0 h:px bw:0 bg:line" />
				<div id="found" hidden>
					<ul id="list" class="m:0 py:1 px:0"></ul>
					<hr class="m:0 h:px bw:0 bg:line" />
				</div>
				<div class="py:1">
					<button id="copy" type="button" hidden data-row>
						<span
							data-symbol="content_copy"
							class="d:f fs:0 w:5 h:5 c:muted"
						></span>
						<span class="fg:1">Copy list</span>
					</button>
					<a
						href="https://github.com/rrenildopereiraa/prisharp/tree/main/apps/extension#how-detection-works"
						target="_blank"
						rel="noreferrer"
						data-row
					>
						<span data-symbol="info" class="d:f fs:0 w:5 h:5 c:muted"></span>
						<span class="fg:1">How Prisharp detects</span>
						<span
							data-symbol="open_in_new"
							class="d:f fs:0 w:4 h:4 c:muted"
						></span>
					</a>
				</div>
			</section>

			<section id="detail" hidden aria-labelledby="name">
				<header class="d:f ai:c g:1 py:2 px:2">
					<button
						id="back"
						type="button"
						aria-label="Back to the list"
						class="d:f ai:c jc:c fs:0 w:8 h:8 br:9999 bw:0 bg:transparent c:muted h:bg:hover c:p fv:os:s fv:ow:2 fv:oc:focus"
					>
						<span data-symbol="arrow_back" class="d:f w:5 h:5"></span>
					</button>
					<h2
						id="name"
						class="m:0 fg:1 min-w:0 fs:md fw:400 o:h to:e ws:nw"
					></h2>
					<button
						type="button"
						data-close
						aria-label="Close"
						class="d:f ai:c jc:c fs:0 w:8 h:8 br:9999 bw:0 bg:transparent c:muted h:bg:hover c:p fv:os:s fv:ow:2 fv:oc:focus"
					>
						<span data-symbol="close" class="d:f w:5 h:5"></span>
					</button>
				</header>
				<hr class="m:0 h:px bw:0 bg:line" />
				<div class="d:f ai:c g:3 p:4">
					<span
						id="badge"
						class="d:f ai:c jc:c fs:0 w:11 h:11 br:lg bg:well"
					></span>
					<div class="min-w:0">
						<p id="headline" class="m:0"></p>
						<p id="subline" class="m:0 mt:1 fs:xs c:muted"></p>
					</div>
				</div>
				<hr class="m:0 h:px bw:0 bg:line" />
				<h3 class="m:0 pt:3 pb:1 px:4 fs:xs fw:400 c:muted">
					How Prisharp knows
				</h3>
				<ul id="evidence" class="m:0 pt:0 pb:2 px:0"></ul>
				<hr class="m:0 h:px bw:0 bg:line" />
				<div class="py:1">
					<a id="website" href="#" target="_blank" rel="noreferrer" data-row>
						<span
							data-symbol="language"
							class="d:f fs:0 w:5 h:5 c:muted"
						></span>
						<span id="website-label" class="fg:1 min-w:0 o:h to:e ws:nw"></span>
						<span
							data-symbol="open_in_new"
							class="d:f fs:0 w:4 h:4 c:muted"
						></span>
					</a>
					<button id="copy-evidence" type="button" data-row>
						<span
							data-symbol="content_copy"
							class="d:f fs:0 w:5 h:5 c:muted"
						></span>
						<span class="fg:1">Copy evidence</span>
					</button>
				</div>
			</section>
		</main>
	</body>
</html>
