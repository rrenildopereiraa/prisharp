<!doctype html>
<html lang="en" class="cs:ld">
	<head>
		<meta charset="utf-8" />
		<title>Prisharp</title>
		<link rel="stylesheet" href="popup.css" />
		<link rel="stylesheet" href="src/base.css" />
		<script type="module" src="src/popup.js"></script>
	</head>
	<!-- Drawn in prisharp.com's style: its serif for names and headings, its
	     mono for the rest, thin lines between rows and square corners. Three
	     pages: the list, one technology, and the settings. Classes for the
	     repeated parts (icon buttons, text buttons, switches) are set in
	     src/popup.js. -->
	<body class="m:0 w:88 bg:raised c:label ff:mono fs:sm">
		<main>
			<section id="home" aria-labelledby="status">
				<header class="d:f ai:c jc:sb g:2 pt:3 pr:3 pl:5">
					<span id="host" class="min-w:0 fs:xs c:hint o:h to:e ws:nw"></span>
					<span class="d:f fs:0">
						<button
							id="open-settings"
							type="button"
							data-icon
							aria-label="Settings"
						>
							<span data-symbol="settings" class="d:f w:4 h:4"></span>
						</button>
						<button type="button" data-close data-icon aria-label="Close">
							<span data-symbol="close" class="d:f w:4 h:4"></span>
						</button>
					</span>
				</header>
				<h1
					id="status"
					role="status"
					class="d:f ai:b g:3 m:0 mt:6 px:5 ff:sans fs:3xl fw:400 lh:1"
				>
					Reading the page…
				</h1>
				<ul id="list" hidden class="m:0 mt:6 mx:5 p:0 btw:1 btc:line"></ul>
				<div id="copies" hidden class="px:5 pt:4">
					<button id="copy" type="button" data-text>
						<span data-caption>Copy the list</span>
					</button>
				</div>
				<div class="h:5"></div>
			</section>

			<section id="detail" hidden aria-labelledby="name">
				<header class="d:f ai:c jc:sb g:2 pt:3 pr:3 pl:5">
					<button id="back" type="button" data-back>
						<span data-symbol="back" class="d:f fs:0 w:4 h:4"></span>
						<span id="back-label">All</span>
					</button>
					<button type="button" data-close data-icon aria-label="Close">
						<span data-symbol="close" class="d:f w:4 h:4"></span>
					</button>
				</header>
				<div class="d:f ai:c g:4 mt:4 px:5">
					<span id="badge" class="d:f fs:0"></span>
					<h2
						id="name"
						class="m:0 min-w:0 ff:sans fs:4xl fw:400 lh:1 ls:-1 o:h to:e ws:nw"
					></h2>
				</div>
				<p id="tags" class="d:f fw:w ai:c g:2 m:0 mt:4 px:5 fs:xs"></p>
				<h3
					id="evidence-title"
					class="d:f jc:sb m:0 mt:6 mb:1 px:5 fs:xs fw:400 c:hint"
				>
					<span>Found in the page</span>
					<span id="evidence-count"></span>
				</h3>
				<!-- Each match on a row of its own, with room on its top line for
				     where it came from and an action on it. -->
				<ul
					id="evidence"
					aria-labelledby="evidence-title"
					class="m:0 mx:5 p:0 btw:1 btc:line fs:xs"
				></ul>
				<div class="d:f ai:c jc:sb g:4 p:5 fs:xs">
					<a
						id="website"
						href="#"
						target="_blank"
						rel="noreferrer"
						class="min-w:0 c:accent td:none o:h to:e ws:nw h:td:u fv:os:s fv:ow:2 fv:oo:2 fv:oc:focus"
					></a>
					<button id="copy-evidence" type="button" hidden data-text>
						<span data-caption>Copy</span>
					</button>
				</div>
			</section>

			<section id="settings" hidden aria-labelledby="settings-title">
				<header class="d:f ai:c jc:sb g:2 pt:3 pr:3 pl:5">
					<button id="settings-back" type="button" data-back>
						<span data-symbol="back" class="d:f fs:0 w:4 h:4"></span>
						<span>Back</span>
					</button>
					<button type="button" data-close data-icon aria-label="Close">
						<span data-symbol="close" class="d:f w:4 h:4"></span>
					</button>
				</header>
				<div class="d:f ai:c g:3 mt:4 px:5">
					<svg
						viewBox="0 0 40 48"
						aria-hidden="true"
						class="d:b fs:0 w:8 h:10 c:accent"
					>
						<g fill="currentColor">
							<path d="m0 14.5264v18.9473l17.8947-12.2437v-18.94741z" />
							<path d="m40 14.5263v18.9474l-17.8947-12.2438v-18.94737z" />
						</g>
						<g fill="currentColor" class="o:60">
							<path d="m0 33.4737v-18.9474l17.8947 12.2438v18.9474z" />
							<path d="m40 33.4737v-18.9474l-17.8947 12.2438v18.9474z" />
						</g>
					</svg>
					<h2 id="settings-title" class="m:0 ff:sans fs:4xl fw:400 lh:1 ls:-1">
						Settings
					</h2>
				</div>
				<div class="d:f fd:c g:4 mt:5 mx:5">
					<section aria-labelledby="toolbar-title">
						<h3 id="toolbar-title" data-section>
							<span class="c:accent">01</span> Toolbar
						</h3>
						<div class="btw:1 btc:line">
							<!-- Off until turned on, and turning it on asks for access to
							     every site: the only way to count before anyone clicks. -->
							<div data-setting>
								<span
									aria-hidden="true"
									class="p:r d:f ai:c jc:c fs:0 w:7 h:7 bw:1 bc:line bg:paper"
								>
									<svg viewBox="0 0 40 48" class="d:b w:3 h:4 c:accent">
										<g fill="currentColor">
											<path d="m0 14.5264v18.9473l17.8947-12.2437v-18.94741z" />
											<path
												d="m40 14.5263v18.9474l-17.8947-12.2438v-18.94737z"
											/>
										</g>
										<g fill="currentColor" class="o:60">
											<path d="m0 33.4737v-18.9474l17.8947 12.2438v18.9474z" />
											<path
												d="m40 33.4737v-18.9474l-17.8947 12.2438v18.9474z"
											/>
										</g>
									</svg>
									<span
										class="p:a r:-2 b:-2 min-w:4 h:4 px:1 bg:accent c:on-fill ta:c fs:xs lh:4"
										>7</span
									>
								</span>
								<span id="count-title" class="fg:1">Count on the icon</span>
								<button
									id="count"
									type="button"
									role="switch"
									aria-checked="false"
									aria-labelledby="count-title"
									title="Shows how many technologies each site uses, before you click. Asks to read the sites you open; nothing leaves your browser."
									data-key
								>
									Off
								</button>
							</div>
						</div>
					</section>
					<section aria-labelledby="copying-title">
						<h3 id="copying-title" data-section>
							<span class="c:accent">02</span> Copying
						</h3>
						<div class="btw:1 btc:line">
							<div data-setting>
								<span id="show-copy-title" class="fg:1"
									>Show the copy button</span
								>
								<button
									id="show-copy"
									type="button"
									role="switch"
									aria-checked="false"
									aria-labelledby="show-copy-title"
									data-key
								>
									Off
								</button>
							</div>
							<div data-setting>
								<span id="format-title" class="fg:1">Copy as</span>
								<span
									role="radiogroup"
									aria-labelledby="format-title"
									class="d:f"
								>
									<label data-option>
										<input type="radio" name="format" value="text" data-radio />
										Text
									</label>
									<label data-option>
										<input
											type="radio"
											name="format"
											value="markdown"
											data-radio
										/>
										Markdown
									</label>
								</span>
							</div>
						</div>
					</section>
					<section aria-labelledby="appearance-title">
						<h3 id="appearance-title" data-section>
							<span class="c:accent">03</span> Appearance
						</h3>
						<div class="btw:1 btc:line">
							<div data-setting>
								<span id="theme-title" class="fg:1">Theme</span>
								<span
									role="radiogroup"
									aria-labelledby="theme-title"
									class="d:f"
								>
									<label data-option>
										<input type="radio" name="theme" value="auto" data-radio />
										Auto
									</label>
									<label data-option>
										<input type="radio" name="theme" value="light" data-radio />
										Light
									</label>
									<label data-option>
										<input type="radio" name="theme" value="dark" data-radio />
										Dark
									</label>
								</span>
							</div>
						</div>
					</section>
				</div>
				<footer
					class="d:f ai:c jc:sb g:4 h:12 mt:6 px:5 btw:1 btc:line fs:xs c:hint"
				>
					<span id="version"></span>
					<span class="d:f g:4">
						<a
							href="https://prisharp.com/docs/"
							target="_blank"
							rel="noreferrer"
							data-footer
							>Docs</a
						>
						<a
							href="https://prisharp.com/privacy/"
							target="_blank"
							rel="noreferrer"
							data-footer
							>Privacy</a
						>
						<a
							href="https://github.com/rrenildopereiraa/prisharp"
							target="_blank"
							rel="noreferrer"
							data-footer
							>GitHub</a
						>
					</span>
				</footer>
			</section>
		</main>
	</body>
</html>
