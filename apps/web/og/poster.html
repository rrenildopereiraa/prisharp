<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Prisharp — share card</title>
		<style>
			@font-face {
				font-family: "Instrument Serif";
				font-weight: 400;
				src: url("fonts/instrument-serif-latin-400-normal.woff2")
					format("woff2");
			}
			@font-face {
				font-family: "Instrument Serif";
				font-style: italic;
				font-weight: 400;
				src: url("fonts/instrument-serif-latin-400-italic.woff2")
					format("woff2");
			}
			@font-face {
				font-family: "Geist Mono";
				font-weight: 100 900;
				src: url("fonts/geist-mono-latin-wght-normal.woff2")
					format("woff2-variations");
			}

			* {
				box-sizing: border-box;
			}
			html,
			body {
				margin: 0;
				width: 1200px;
				height: 630px;
				overflow: hidden;
			}
			body {
				background: #f3f4f7;
				color: #101218;
				font-family: "Instrument Serif", Georgia, serif;
			}

			.wave {
				position: absolute;
				inset: 0 0 0 52%;
				background: url("threads.jpg") center / cover no-repeat;
				-webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 38%);
				mask-image: linear-gradient(90deg, transparent 0%, #000 38%);
			}

			.brand {
				position: absolute;
				top: 54px;
				left: 64px;
				display: flex;
				align-items: center;
				gap: 18px;
			}
			.brand svg {
				width: 42px;
				height: 50px;
				display: block;
			}
			.brand span {
				font-size: 56px;
				letter-spacing: -0.01em;
			}

			h1 {
				position: absolute;
				left: 64px;
				bottom: 58px;
				margin: 0;
				font-weight: 400;
				font-size: 96px;
				line-height: 0.98;
				letter-spacing: -0.02em;
				max-width: 720px;
			}
			h1 em {
				font-style: italic;
			}
		</style>
	</head>
	<body>
		<div class="wave"></div>
		<div class="brand">
			<svg viewBox="0 0 40 48" aria-hidden="true">
				<g fill="#8394ff">
					<path d="m0 14.5264v18.9473l17.8947-12.2437v-18.94741z" />
					<path d="m40 14.5263v18.9474l-17.8947-12.2438v-18.94737z" />
				</g>
				<g fill="#8394ff" opacity=".6">
					<path d="m0 33.4737v-18.9474l17.8947 12.2438v18.9474z" />
					<path d="m40 33.4737v-18.9474l-17.8947 12.2438v18.9474z" />
				</g>
			</svg>
			<span>Prisharp</span>
		</div>
		<h1>Was this site<br />built with <em>React</em>?</h1>
	</body>
</html>
